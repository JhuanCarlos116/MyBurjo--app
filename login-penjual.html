<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login & Daftar Penjual - MYBURJO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #fff9ef; color: #1f1b11; }
        h1, h2 { font-family: 'Plus Jakarta Sans', sans-serif; }
        .input-pin { letter-spacing: 0.8em; padding-left: 0.8em; }
        .ambient-shadow { box-shadow: 0 4px 20px rgba(31, 27, 17, 0.08); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen px-6 py-10">

    <div id="modal-alert-kustom" class="fixed inset-0 bg-[#1f1b11]/80 z-[200] hidden items-center justify-center px-6 backdrop-blur-sm transition-all duration-300">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 flex flex-col ambient-shadow scale-100 transition-transform duration-300">
            <div class="flex items-center gap-3 text-[#705d00] mb-3" id="modal-header-container">
                <span id="modal-ikon" class="material-symbols-outlined text-3xl">info</span>
                <h2 id="modal-judul" class="font-extrabold text-xl leading-tight">Pemberitahuan</h2>
            </div>
            <p id="modal-pesan" class="text-xs font-semibold text-[#7e7760] mb-6 whitespace-pre-line leading-relaxed">Pesan notifikasi aplikasi.</p>
            <button id="modal-btn-ok" class="w-full bg-[#1f1b11] text-[#ffd700] py-3 rounded-xl font-bold shadow-sm active:scale-95 transition-all text-sm text-center">
                Selesai
            </button>
        </div>
    </div>
    <div class="w-full max-w-md flex flex-col items-center gap-8">
        <div class="text-center">
            <h1 class="text-4xl font-extrabold text-[#705d00] tracking-tight">MYPENJUAL</h1>
            <p class="text-sm font-bold text-[#1f1b11] mt-1" id="status-label">Portal Khusus Mitra</p>
        </div>
        
        <div class="w-full bg-white p-6 rounded-3xl shadow-sm border-2 border-[#f5eddb] flex flex-col gap-6">
            <div id="step-id" class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">ID Penjual</label>
                    <input type="text" id="id-input" maxlength="8" placeholder="Contoh: 12052601" 
                           class="w-full bg-[#f5eddb] rounded-xl px-4 py-3 text-xl font-extrabold text-center tracking-widest focus:outline-none focus:ring-2 focus:ring-[#ffd700]">
                </div>
                <button onclick="cekIdKeDatabase()" id="btn-lanjut" class="w-full bg-[#ffd700] text-[#1f1b11] py-4 rounded-xl font-extrabold text-lg shadow-md active:scale-95 transition-all">Lanjut</button>
                
                <div class="w-full h-[1px] bg-gray-200 my-1"></div>
                <button onclick="bukaFormDaftar()" class="w-full bg-emerald-50 text-emerald-700 border border-emerald-200 py-3 rounded-xl font-bold text-sm active:scale-95 transition-all">Daftar Jadi Mitra Baru</button>
                <button onclick="window.location.href='index.html'" class="text-gray-400 font-bold text-sm mt-1">Kembali</button>
            </div>

            <div id="step-login" class="hidden flex flex-col gap-4 text-center">
                <p class="text-sm font-semibold text-gray-500">Selamat Datang,</p>
                <h2 id="warung-nama" class="text-2xl font-black text-[#705d00] -mt-2">Nama Warung</h2>
                <input type="password" id="pin-input" maxlength="4" placeholder="••••" 
                       class="input-pin w-full bg-[#f5eddb] rounded-xl py-4 text-3xl font-black text-center focus:outline-none focus:ring-2 focus:ring-[#ffd700]">
                <button onclick="validasiLogin()" id="btn-masuk" class="w-full bg-[#ffd700] text-[#1f1b11] py-4 rounded-xl font-extrabold text-lg shadow-md mt-2">Masuk Sekarang</button>
                <button onclick="location.reload()" class="text-gray-400 font-bold text-xs mt-2">Ganti ID</button>
            </div>

            <div id="step-aktivasi" class="hidden flex flex-col gap-4">
                <div class="bg-yellow-50 text-yellow-800 p-3 rounded-xl text-xs font-bold text-center border border-yellow-200">
                    ID Terdeteksi! Silakan buat 4 digit PIN Keamanan Anda.
                </div>
                <input type="password" id="pin-baru" maxlength="4" placeholder="Buat PIN Baru" class="input-pin w-full bg-[#f5eddb] rounded-xl py-3 text-2xl font-black text-center focus:outline-none">
                <input type="password" id="pin-konfirmasi" maxlength="4" placeholder="Ulangi PIN" class="input-pin w-full bg-[#f5eddb] rounded-xl py-3 text-2xl font-black text-center focus:outline-none">
                <button onclick="simpanPinBaru()" class="w-full bg-[#ffd700] text-[#1f1b11] py-4 rounded-xl font-extrabold shadow-md">Simpan PIN</button>
            </div>

            <div id="step-daftar" class="hidden flex flex-col gap-4">
                <div class="text-center mb-1">
                    <h2 class="text-xl font-extrabold text-[#705d00]">Registrasi Burjo</h2>
                    <p class="text-xs text-gray-500 font-medium">Lengkapi formulir kemitraan Anda</p>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Nama Warung Burjo</label>
                    <input type="text" id="reg-nama" placeholder="Contoh: Burjo Desi" class="w-full bg-[#fff9ef] border border-[#f5eddb] rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-[#ffd700]">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Buat PIN Keamanan (4 Digit)</label>
                    <input type="password" id="reg-pin" maxlength="4" placeholder="••••" class="input-pin w-full bg-[#fff9ef] border border-[#f5eddb] rounded-xl py-3 text-xl font-black text-center focus:outline-none focus:ring-2 focus:ring-[#ffd700]">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Latitude</label>
                        <input type="number" step="any" id="reg-lat" placeholder="-7.0493" class="w-full bg-[#fff9ef] border border-[#f5eddb] rounded-xl px-3 py-3 text-xs font-bold focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Longitude</label>
                        <input type="number" step="any" id="reg-lng" placeholder="110.4382" class="w-full bg-[#fff9ef] border border-[#f5eddb] rounded-xl px-3 py-3 text-xs font-bold focus:outline-none">
                    </div>
                </div>

                <button onclick="prosesPendaftaranBurjo()" id="btn-registrasi" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-extrabold text-base shadow-md active:scale-95 transition-all mt-2">Daftar & Buat Akun</button>
                <button onclick="location.reload()" class="text-gray-400 font-bold text-xs text-center mt-1">Batal</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCLmFSnIL4NJrRqqyQ6TYZGL4TKGzIXfjE", 
            projectId: "myburjo", 
            appId: "1:25464436577:web:89a3105315f8fbcc703720" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeData = null;
        let activeId = "";

        // Engine Dialog Kustom Pengganti Sistem Alert Bawaan Browser
        const customAlertEl = document.getElementById('modal-alert-kustom');
        const customAlertHeader = document.getElementById('modal-header-container');
        const customAlertJudul = document.getElementById('modal-judul');
        const customAlertPesan = document.getElementById('modal-pesan');
        const customAlertIkon = document.getElementById('modal-ikon');
        const customAlertBtn = document.getElementById('modal-btn-ok');

        function tampilkanAlertKustom(judul, pesan, jenis = "info") {
            return new Promise((resolve) => {
                customAlertJudul.innerText = judul;
                customAlertPesan.innerText = pesan;
                
                // Konfigurasi visual berdasarkan jenis alert
                if (jenis === "error") {
                    customAlertHeader.className = "flex items-center gap-3 text-red-600 mb-3";
                    customAlertIkon.innerText = "cancel";
                } else if (jenis === "success") {
                    customAlertHeader.className = "flex items-center gap-3 text-emerald-600 mb-3";
                    customAlertIkon.innerText = "check_circle";
                } else {
                    customAlertHeader.className = "flex items-center gap-3 text-[#705d00] mb-3";
                    customAlertIkon.innerText = "info";
                }

                customAlertEl.classList.remove('hidden');
                customAlertEl.classList.add('flex');

                customAlertBtn.onclick = () => {
                    customAlertEl.classList.replace('flex', 'hidden');
                    resolve();
                };
            });
        }

        // Fungsi pengecekan ID Login
        window.cekIdKeDatabase = async () => {
            const idVal = document.getElementById('id-input').value;
            if(idVal.length < 8) {
                await tampilkanAlertKustom("Validasi Gagal", "ID Penjual harus berjumlah tepat 8 digit angka!", "error");
                return;
            }

            const btn = document.getElementById('btn-lanjut');
            btn.innerText = "Memeriksa...";

            try {
                const docRef = doc(db, "penjual", idVal);
                const snap = await getDoc(docRef);

                if(snap.exists()){
                    activeId = idVal;
                    activeData = snap.data();
                    document.getElementById('step-id').classList.add('hidden');

                    if(!activeData.pin || activeData.pin === "") {
                        document.getElementById('step-aktivasi').classList.remove('hidden');
                        document.getElementById('step-aktivasi').classList.add('flex');
                        document.getElementById('status-label').innerText = "Aktivasi Akun";
                    } else {
                        document.getElementById('warung-nama').innerText = activeData.nama_burjo;
                        document.getElementById('step-login').classList.remove('hidden');
                        document.getElementById('status-label').innerText = "Verifikasi PIN";
                    }
                } else {
                    await tampilkanAlertKustom("Tidak Ditemukan", "ID Penjual tidak terdaftar di database sistem kami!", "error");
                }
            } catch (e) { 
                await tampilkanAlertKustom("Kesalahan Koneksi", e.message, "error");
            } finally {
                btn.innerText = "Lanjut";
            }
        };

        // Buka Panel Registrasi Baru
        window.bukaFormDaftar = () => {
            document.getElementById('step-id').classList.add('hidden');
            document.getElementById('step-daftar').classList.remove('hidden');
            document.getElementById('status-label').innerText = "Kemitraan Baru";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    document.getElementById('reg-lat').value = position.coords.latitude;
                    document.getElementById('reg-lng').value = position.coords.longitude;
                });
            }
        };

        // Eksekusi Pembuatan Data Burjo Baru di Firebase Firestore
        window.prosesPendaftaranBurjo = async () => {
            const namaBurjo = document.getElementById('reg-nama').value;
            const pinBaru = document.getElementById('reg-pin').value;
            const latVal = document.getElementById('reg-lat').value;
            const lngVal = document.getElementById('reg-lng').value;

            if(!namaBurjo || pinBaru.length !== 4 || !latVal || !lngVal) {
                await tampilkanAlertKustom("Formulir Tidak Lengkap", "Harap isi nama warung, koordinat lokasi, serta tentukan 4 digit PIN keamanan dengan benar!", "error");
                return;
            }

            const btnReg = document.getElementById('btn-registrasi');
            btnReg.innerText = "Mendaftarkan Mitra...";
            btnReg.disabled = true;

            try {
                const sekarang = new Date();
                const dd = String(sekarang.getDate()).padStart(2, '0');
                const mm = String(sekarang.getMonth() + 1).padStart(2, '0'); 
                const yy = String(sekarang.getFullYear()).slice(-2); 
                const prefiksTanggal = `${dd}${mm}${yy}`; 

                const querySnapshot = await getDocs(collection(db, "penjual"));
                let urutanHariIni = 1;

                querySnapshot.forEach((doc) => {
                    if (doc.id.startsWith(prefiksTanggal)) {
                        urutanHariIni++;
                    }
                });

                const duaDigitUrutan = String(urutanHariIni).padStart(2, '0');
                const generatedId = `${prefiksTanggal}${duaDigitUrutan}`; 

                const deskripsiMejaDefault = [];
                for(let i = 1; i <= 10; i++) {
                    deskripsiMejaDefault.push(`Meja ${i}: Muat 4 Orang, Fasilitas Standar Burjo`);
                }

                const payloadBurjoBaru = {
                    nama_burjo: namaBurjo,
                    pin: pinBaru,
                    totalMeja: 10,
                    meja_aktif: [], 
                    listMejaTerpakai: [],
                    deskripsi_meja: deskripsiMejaDefault,
                    lokasi: {
                        latitude: parseFloat(latVal),
                        longitude: parseFloat(lngVal)
                    }
                };

                await setDoc(doc(db, "penjual", generatedId), payloadBurjoBaru);
                
                await tampilkanAlertKustom(
                    "Pendaftaran Berhasil!", 
                    `ID PENJUAL ANDA: ${generatedId}\n\nCatat ID ini baik-baik untuk masuk kembali ke aplikasi portal mitra di masa mendatang.`, 
                    "success"
                );
                
                localStorage.setItem("myburjo_penjual_id", generatedId);
                window.location.href = `laman-utama-penjual.html?id=${generatedId}`;
                
            } catch (error) {
                await tampilkanAlertKustom("Registrasi Gagal", error.message, "error");
                btnReg.innerText = "Daftar & Buat Akun";
                btnReg.disabled = false;
            }
        };

        window.simpanPinBaru = async () => {
            const p1 = document.getElementById('pin-baru').value;
            const p2 = document.getElementById('pin-konfirmasi').value;

            if(p1 !== p2 || p1.length !== 4) {
                await tampilkanAlertKustom("PIN Tidak Cocok", "Isian konfirmasi tidak sesuai atau panjang PIN kurang dari 4 digit!", "error");
                return;
            }

            try {
                await updateDoc(doc(db, "penjual", activeId), { pin: p1 });
                await tampilkanAlertKustom("PIN Tersimpan", "PIN Keamanan Akun Anda berhasil dibuat!", "success");
                localStorage.setItem("myburjo_penjual_id", activeId);
                window.location.href = "laman-utama-penjual.html?id=" + activeId;
            } catch (e) {
                await tampilkanAlertKustom("Gagal Menyimpan", "Sistem gagal mengamankan PIN baru Anda. Coba lagi.", "error");
            }
        };

        window.validasiLogin = async () => {
            const inputPin = document.getElementById('pin-input').value;
            const pinDb = activeData.pin ? activeData.pin.toString() : "";

            if(inputPin === pinDb) {
                localStorage.setItem("myburjo_penjual_id", activeId);
                window.location.href = "laman-utama-penjual.html?id=" + activeId;
            } else {
                await tampilkanAlertKustom("Akses Ditolak", "PIN yang Anda masukkan salah! Silakan coba lagi.", "error");
                document.getElementById('pin-input').value = "";
            }
        };
    </script>
</body>
</html>
