<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Edit Katalog Meja - MYBURJO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #fff9ef;
            color: #1f1b11;
        }

        h1,
        h2,
        h3 {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .ambient-shadow {
            box-shadow: 0 4px 20px rgba(31, 27, 17, 0.08);
        }

        /* Animasi Modal */
        .modal-enter {
            opacity: 0;
            transform: scale(0.9);
        }

        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>

<body class="antialiased pb-24">

    <header
        class="bg-white sticky top-0 z-50 px-6 py-4 flex items-center justify-between border-b border-[#f5eddb] shadow-sm">
        <button onclick="kembaliKeUtama()"
            class="w-10 h-10 flex items-center justify-center rounded-xl bg-[#fff9ef] text-[#1f1b11] active:scale-95 transition-all">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <h1 class="font-extrabold text-lg tracking-tighter">Edit Katalog Meja</h1>
        <button onclick="simpanPerubahan()" id="btn-simpan"
            class="font-bold text-sm text-[#705d00] bg-[#ffd700] px-4 py-2 rounded-xl active:scale-95 transition-all shadow-sm">
            Simpan
        </button>
    </header>

    <main class="p-5 space-y-4" id="container-katalog">
        <div class="text-center py-10 text-[#7e7760] font-semibold animate-pulse text-sm">
            Memuat Katalog Meja...
        </div>
    </main>

    <div class="px-5 mt-2">
        <button onclick="tambahMeja()"
            class="w-full bg-[#fff9ef] text-[#705d00] py-4 rounded-3xl font-bold border-2 border-dashed border-[#d1c8b4] flex items-center justify-center gap-2 active:bg-[#f5eddb] transition-all">
            <span class="material-symbols-outlined">add_circle</span> Tambah Meja
        </button>
    </div>

    <div id="modal-qr"
        class="fixed inset-0 bg-[#1f1b11]/80 z-[100] hidden items-center justify-center px-6 backdrop-blur-sm transition-opacity duration-300">
        <div id="modal-content"
            class="bg-white w-full max-w-sm rounded-3xl p-6 flex flex-col items-center ambient-shadow modal-enter">
            <h2 class="font-extrabold text-2xl text-[#1f1b11] mb-1">Scan Meja</h2>
            <p id="qr-subtitle" class="text-sm font-semibold text-[#7e7760] mb-6">Meja 01</p>

            <div
                class="w-48 h-48 bg-[#fff9ef] rounded-2xl border-2 border-[#f5eddb] flex items-center justify-center mb-6 overflow-hidden p-2">
                <img id="qr-image" src="" alt="QR Code" class="w-full h-full object-cover">
            </div>

            <p class="text-xs text-center text-[#7e7760] mb-6 font-medium">Pengguna bisa melakukan check-in dengan
                memindai kode QR ini menggunakan aplikasi MyBurjo.</p>

            <div class="flex gap-3 w-full">
                <button onclick="tutupModal()"
                    class="flex-1 bg-[#fff9ef] text-[#1f1b11] py-3 rounded-xl font-bold border border-[#f5eddb] active:scale-95 transition-all">
                    Tutup
                </button>
                <button onclick="simpanQR()" id="btn-download-qr"
                    class="flex-[1.5] bg-[#ffd700] text-[#705d00] py-3 rounded-xl font-bold border border-[#f5eddb] shadow-sm active:scale-95 transition-all flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-lg">download</span> Simpan QR
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase MyBurjo
        const firebaseConfig = {
            apiKey: "AIzaSyCLmFSnIL4NJrRqqyQ6TYZGL4TKGzIXfjE",
            projectId: "myburjo",
            appId: "1:25464436577:web:89a3105315f8fbcc703720"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Ambil ID Penjual (Bisa dari LocalStorage atau default)
        const burjoId = localStorage.getItem("myburjo_penjual_id") || "12052601";
        const docRef = doc(db, "penjual", burjoId);

        let dataMeja = [];
        let currentQrUrl = "";
        let currentMejaNomor = "";

        // PERBAIKAN: Fungsi global baru untuk menangani perpindahan halaman kembali dengan parameter ID mitra yang tepat
        window.kembaliKeUtama = () => {
            window.location.href = `laman-utama-penjual.html?id=${burjoId}`;
        };

        // Inisialisasi Laman
        async function loadKatalog() {
            try {
                const snap = await getDoc(docRef);
                if (snap.exists()) {
                    const data = snap.data();
                    const rawDesc = data.deskripsi_meja || [];

                    // Parsing array string ke array objek agar mudah diedit
                    dataMeja = rawDesc.map((text, index) => {
                        const splitData = text.split(': ');
                        return {
                            nomor: index + 1,
                            deskripsi: splitData.length > 1 ? splitData[1] : text
                        };
                    });
                    renderKatalog();
                }
            } catch (error) {
                console.error("Gagal memuat:", error);
                document.getElementById('container-katalog').innerHTML = "<p class='text-center text-red-500'>Gagal memuat data meja.</p>";
            }
        }

        // Render List Meja ke Layar
        function renderKatalog() {
            const container = document.getElementById('container-katalog');
            container.innerHTML = "";

            if (dataMeja.length === 0) {
                container.innerHTML = `<p class="text-center text-[#7e7760] py-10 font-medium">Belum ada meja di katalog.</p>`;
                return;
            }

            dataMeja.forEach((meja, index) => {
                const idDiv = `meja-card-${index}`;
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-3xl ambient-shadow border border-[#f5eddb] flex flex-col gap-3">
                        <div class="flex justify-between items-center border-b border-[#f5eddb] pb-3">
                            <h2 class="font-extrabold text-lg text-[#705d00]">MEJA ${meja.nomor.toString().padStart(2, '0')}</h2>
                            <div class="flex gap-2">
                                <button onclick="bukaQR(${meja.nomor})" class="w-10 h-10 bg-[#fff9ef] text-[#1f1b11] rounded-xl flex items-center justify-center border border-[#f5eddb] active:scale-95 transition-all">
                                    <span class="material-symbols-outlined text-xl">qr_code</span>
                                </button>
                                <button onclick="hapusMeja(${index})" class="w-10 h-10 bg-red-50 text-red-600 rounded-xl flex items-center justify-center border border-red-100 active:scale-95 transition-all">
                                    <span class="material-symbols-outlined text-xl">delete</span>
                                </button>
                            </div>
                        </div>
                        <div class="flex w-full">
                            <textarea onchange="updateTeks(${index}, this.value)" class="w-full bg-[#fff9ef] text-[#1f1b11] text-sm font-medium rounded-xl p-3 border border-[#f5eddb] focus:outline-none focus:border-[#ffd700] resize-none h-20 placeholder:text-[#d1c8b4]" placeholder="Contoh: Muat 4 orang, ada colokan listrik...">${meja.deskripsi}</textarea>
                        </div>
                    </div>
                `;
            });
        }

        // --- FUNGSI INTERAKSI --- //

        // 1. Update teks deskripsi secara lokal
        window.updateTeks = (index, value) => {
            dataMeja[index].deskripsi = value;
        };

        // 2. Tambah Meja (Otomatis nomor berikutnya)
        window.tambahMeja = () => {
            dataMeja.push({
                nomor: dataMeja.length + 1,
                deskripsi: ""
            });
            renderKatalog();
            setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
        };

        // 3. Hapus Meja
        window.hapusMeja = (index) => {
            const konfirmasi = confirm(`Apakah kamu yakin ingin menghapus Meja ${dataMeja[index].nomor}?`);
            if (konfirmasi) {
                dataMeja.splice(index, 1);
                dataMeja.forEach((m, i) => m.nomor = i + 1);
                renderKatalog();
            }
        };

        // 4. Simpan ke Firebase
        window.simpanPerubahan = async () => {
            const btn = document.getElementById('btn-simpan');
            btn.innerText = "Menyimpan...";
            btn.classList.add("opacity-50", "pointer-events-none");

            try {
                const finalArray = dataMeja.map(m => `Meja ${m.nomor}: ${m.deskripsi}`);

                await updateDoc(docRef, {
                    deskripsi_meja: finalArray
                });

                alert("Berhasil! Katalog meja telah disimpan.");
            } catch (error) {
                alert("Gagal menyimpan perubahan. Coba lagi.");
                console.error(error);
            } finally {
                btn.innerText = "Simpan";
                btn.classList.remove("opacity-50", "pointer-events-none");
            }
        };

        // --- MODAL QR CODE & DOWNLOAD --- //
        const modalQr = document.getElementById('modal-qr');
        const modalContent = document.getElementById('modal-content');

        window.bukaQR = (nomor) => {
            currentMejaNomor = nomor.toString().padStart(2, '0');
            document.getElementById('qr-subtitle').innerText = `Meja ${currentMejaNomor}`;

            const qrData = `MYBURJO-${burjoId}-MEJA-${currentMejaNomor}`;

            currentQrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(qrData)}`;
            document.getElementById('qr-image').src = currentQrUrl;

            modalQr.classList.remove('hidden');
            modalQr.classList.add('flex');
            setTimeout(() => { modalContent.classList.add('modal-enter-active'); }, 10);
        };

        window.tutupModal = () => {
            modalContent.classList.remove('modal-enter-active');
            setTimeout(() => {
                modalQr.classList.add('hidden');
                modalQr.classList.remove('flex');
            }, 300);
        };

        // Fungsi Download Gambar QR
        window.simpanQR = async () => {
            const btn = document.getElementById('btn-download-qr');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined text-lg animate-spin">sync</span> Menyimpan...`;

            try {
                const response = await fetch(currentQrUrl);
                const blob = await response.blob();

                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `QR_Meja_${currentMejaNomor}.png`;
                document.body.appendChild(a);
                a.click();

                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                console.error("Gagal mendownload QR:", error);
                window.open(currentQrUrl, '_blank');
            } finally {
                btn.innerHTML = originalHTML;
            }
        };

        // Jalankan saat load
        loadKatalog();
    </script>
</body>

</html>
