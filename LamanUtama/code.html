<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>MYBURJO</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- FontAwesome for Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<!-- Custom Tailwind Config for 'Vibrant Efficiency' Design System -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#f97316', // Orange 500
              dark: '#ea580c',   // Orange 600
              light: '#fdba74',  // Orange 300
            }
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    /* Hide scrollbar for cleaner mobile look */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    /* Simple CSS pattern for the fake map background */
    .bg-grid-pattern {
      background-image: linear-gradient(to right, #e5e7eb 1px, transparent 1px),
                        linear-gradient(to bottom, #e5e7eb 1px, transparent 1px);
      background-size: 40px 40px;
    }
  </style>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen overflow-hidden antialiased">
<!-- Main Mobile Container -->
<div class="w-full max-w-md h-full bg-gray-50 flex flex-col relative shadow-2xl sm:border-x border-gray-200">
<!-- BEGIN: Header -->
<header class="bg-white py-3 px-4 border-b border-gray-200 flex justify-center items-center z-20 shrink-0 shadow-sm">
<h1 class="text-xl font-black text-gray-800 tracking-widest uppercase">MYBURJO</h1>
</header>
<!-- END: Header -->
<!-- BEGIN: MapSection -->
<!-- Simulating a map view with markers based on the sketch -->
<div class="h-48 bg-[#f0f4f8] relative border-b border-gray-200 overflow-hidden shrink-0 bg-grid-pattern">
<!-- Diagonal fake road -->
<div class="absolute top-1/2 left-0 w-full h-4 bg-white transform -rotate-12 border-y border-gray-300 shadow-sm"></div>
<div class="absolute top-1/4 right-0 w-3/4 h-3 bg-white transform rotate-6 border-y border-gray-300 shadow-sm"></div>
<!-- Markers -->
<div class="absolute top-6 left-12 flex flex-col items-center">
<i class="fa-solid fa-location-dot text-red-500 text-xl drop-shadow-md"></i>
<span class="text-[10px] font-bold text-gray-800 bg-white/80 px-1 rounded mt-0.5">Burjo Desi</span>
</div>
<div class="absolute top-10 right-16 flex flex-col items-center">
<i class="fa-solid fa-location-dot text-gray-400 text-lg drop-shadow-md"></i>
<span class="text-[10px] font-bold text-gray-700 bg-white/80 px-1 rounded mt-0.5">Burjo SKG</span>
</div>
<div class="absolute bottom-8 left-16 flex flex-col items-center">
<i class="fa-solid fa-location-dot text-gray-400 text-lg drop-shadow-md"></i>
<span class="text-[10px] font-bold text-gray-700 bg-white/80 px-1 rounded mt-0.5">Burjo Lina</span>
</div>
<!-- User Location Indicator -->
<div class="absolute bottom-10 right-20 flex flex-col items-center z-10">
<div class="relative flex h-5 w-5 mb-1 justify-center items-center">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
<i class="fa-solid fa-location-arrow text-blue-600 text-sm transform -rotate-45 relative z-10"></i>
</div>
<span class="text-[10px] font-bold text-blue-700 bg-blue-50/80 px-1.5 py-0.5 rounded-full border border-blue-200">Kamu</span>
</div>
</div>
<!-- END: MapSection -->
<!-- BEGIN: ContentArea -->
<!-- Scrollable list of Burjo locations -->
<main class="flex-1 overflow-y-auto no-scrollbar p-4 pb-28 space-y-4">
<!-- Instructional text from sketch -->
<p class="text-xs text-center text-gray-500 mb-2 flex items-center justify-center gap-2">
<i class="fa-solid fa-arrow-down animate-bounce"></i> Scroll ke bawah untuk cek burjo yang lain
      </p>
<!-- Primary Burjo Card (Detailed in sketch) -->
<article class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col gap-4">
<!-- Header: Image, Title, Distance, Status -->
<div class="flex gap-4">
<!-- Placeholder for Burjo Image -->
<div class="w-20 h-20 rounded-xl bg-orange-50 flex flex-col items-center justify-center text-primary-light shrink-0 border border-orange-100">
<i class="fa-solid fa-store text-2xl mb-1"></i>
<i class="fa-solid fa-sun text-xs"></i>
</div>
<div class="flex-1 flex flex-col justify-between py-0.5">
<div>
<h2 class="text-lg font-bold text-gray-900 leading-tight">Burjo Desi</h2>
<div class="flex items-center text-xs text-gray-500 mt-1.5 font-medium">
<i class="fa-solid fa-person-walking text-primary mr-1.5"></i>
<span>15 menit</span>
<span class="mx-1.5 text-gray-300">•</span>
<span>0,8 km</span>
</div>
</div>
<div class="mt-2">
<span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-bold bg-green-100 text-green-700 border border-green-200">
                Sepi
              </span>
</div>
</div>
</div>
<!-- Availability Indicator -->
<div class="bg-orange-50 border-2 border-primary/20 rounded-xl py-2.5 px-4 text-center">
<p class="text-sm text-orange-800 font-medium mb-0.5">Ketersediaan Meja</p>
<p class="text-xl font-black text-primary tracking-wide">2 / 10 Meja</p>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-primary-dark active:bg-primary-dark text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-sm flex justify-center items-center gap-2">
          Cek Detail Menu
        </button>
</article>
<!-- Placeholder Card 2 for scroll context -->
<article class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col gap-4">
<div class="flex gap-4">
<div class="w-20 h-20 rounded-xl flex items-center justify-center shrink-0 border flex-col bg-orange-50 text-primary-light border-orange-100"><i class="fa-solid fa-store text-2xl mb-1"></i>
<i class="fa-solid fa-sun text-xs"></i></div>
<div class="flex-1 flex flex-col justify-between py-0.5">
<div>
<h2 class="text-lg font-bold leading-tight text-gray-900">Burjo SKG</h2>
<div class="flex items-center text-xs text-gray-500 mt-1.5 font-medium">
<i class="fa-solid fa-person-walking mr-1.5 text-primary"></i>
<span>25 menit</span>
<span class="mx-1.5 text-gray-300">•</span>
<span>1,5 km</span>
</div>
</div>
<div class="mt-2">
<span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-bold bg-red-100 text-red-700 border border-red-200">
                Ramai
              </span>
</div>
</div>
</div>
<div class="bg-orange-50 border-2 border-primary/20 rounded-xl py-2.5 px-4 text-center">
<p class="text-sm text-orange-800 font-medium mb-0.5">Ketersediaan Meja</p>
<p class="text-xl font-black text-primary tracking-wide">9 / 10 Meja</p>
</div><button class="w-full bg-primary hover:bg-primary-dark active:bg-primary-dark text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-sm flex justify-center items-center gap-2">
          Cek Detail Menu
        </button></article>
</main>
<!-- END: ContentArea -->
<!-- BEGIN: BottomNavigation -->
<!-- Fixed bottom navigation bar with a prominent central QR button -->
<nav class="absolute bottom-0 w-full bg-white border-t border-gray-200 pb-5 pt-2 px-6 flex justify-between items-center shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-30 rounded-t-2xl">
<!-- Home Link -->
<a class="flex flex-col items-center justify-center w-16 text-primary" href="#">
<i class="fa-solid fa-house text-xl mb-1"></i>
<span class="text-[10px] font-bold tracking-wide">HOME</span>
</a>
<!-- Central QR Button (Prominent) -->
<div class="relative -top-6">
<button class="bg-primary text-white w-16 h-16 rounded-2xl flex items-center justify-center shadow-lg shadow-primary/40 transform hover:scale-105 active:scale-95 transition-all border-4 border-white">
<i class="fa-solid fa-qrcode text-3xl"></i>
</button>
</div>
<!-- Profile Link -->
<a class="flex flex-col items-center justify-center w-16 text-gray-400 hover:text-gray-600 transition-colors" href="#">
<i class="fa-regular fa-user text-xl mb-1"></i>
<span class="text-[10px] font-bold tracking-wide">PROFIL</span>
</a>
</nav>
<!-- END: BottomNavigation -->
</div>
</body></html>
