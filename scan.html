<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Scan QR - MYBURJO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #fff9ef; color: #1f1b11; }
        #reader { width: 100%; border-radius: 24px; overflow: hidden; border: 4px solid #ffd700; background: #1f1b11; }
        #reader video { object-fit: cover; border-radius: 20px; }
        #reader__dashboard_section_csr span, 
        #reader__dashboard_section_swaplink { display: none !important; }
        #reader__dashboard_section_csr button { 
            background: #ffd700 !important; color: #1f1b11 !important; 
            font-weight: bold; border-radius: 8px; padding: 8px 16px; margin-top: 10px;
        }
    </style>
</head>
<body class="antialiased pb-32">
    
    <header class="bg-white sticky top-0 z-50 py-4 shadow-sm flex items-center justify-center gap-2 border-b border-[#f5eddb] px-5">
        <div class="w-10 h-10 rounded-full bg-[#ffd700] flex items-center justify-center border-2 border-white shadow-sm">
            <span class="material-symbols-outlined text-[#1f1b11]">qr_code_scanner</span> 
        </div>
        <h1 class="font-black text-2xl tracking-tighter text-[#1f1b11]">Scan QR Meja</h1> 
    </header>

    <main class="px-5 mt-8 flex flex-col items-center">
        <div class="w-full max-w-sm shadow-xl shadow-[#ffd700]/10 rounded-[24px]">
            <div id="reader"></div>
            
            <div id="file-reader-dummy" class="hidden"></div>
        </div>

        <p class="mt-6 text-center text-[#7e7760] text-sm font-semibold max-w-[280px]">
            Arahkan kamera ke QR Code yang ada di mejamu untuk Check-in atau Check-out.
        </p>

        <button id="btn-scan-galeri" class="mt-6 flex items-center justify-center gap-3 bg-white px-6 py-3 rounded-xl border border-[#e5dfd3] shadow-sm active:scale-95 transition-all w-full max-w-[220px]">
            <span class="material-symbols-outlined text-[#705d00] text-2xl">image</span>
            <span class="font-bold text-[#1f1b11]">Pilih dari Galeri</span>
        </button>
        
        <input type="file" id="file-qr" accept="image/*" class="hidden">
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-[#f5eddb] h-20 flex justify-around items-center z-[100] shadow-[0_-4px_20px_rgba(0,0,0,0.03)] px-6">
    <a href="index.html" class="flex flex-col items-center gap-1 text-[#d1c8b4] hover:text-[#705d00] transition-colors">
        <span class="material-symbols-outlined text-2xl">home</span>
        <span class="text-[10px] font-bold">Home</span>
    </a>

    <a href="scan.html" class="relative -top-5">
        <div class="bg-[#ffd700] text-[#1f1b11] w-14 h-14 rounded-full flex items-center justify-center shadow-lg border-4 border-white active:scale-95 transition-transform">
            <span class="material-symbols-outlined text-2xl">qr_code_scanner</span>
        </div>
    </a>

    <a href="profile.html" class="flex flex-col items-center gap-1 text-[#d1c8b4] hover:text-[#705d00] transition-colors">
        <span class="material-symbols-outlined text-2xl">person</span>
        <span class="text-[10px] font-bold">Profil</span>
    </a>
</nav>

    <div id="popup-scan" class="fixed inset-0 bg-black/70 z-[300] hidden items-center justify-center px-6 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[32px] p-6 text-center space-y-4 shadow-2xl transition-transform duration-200 ease-out">
            <div id="popup-icon" class="w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl"></div>
            <h2 id="popup-title" class="font-extrabold text-2xl text-[#1f1b11]"></h2>
            <p id="popup-subtitle" class="text-sm font-semibold text-[#7e7760] px-2"></p>
            <button onclick="tutupPopupDanSelesai()" class="w-full bg-[#ffd700] text-[#705d00] py-4 rounded-2xl font-black text-sm border-2 border-[#1f1b11] shadow-[0_4px_0_#1f1b11] active:translate-y-1 active:shadow-none transition-all">
                SCAN MEJA LAIN
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCLmFSnIL4NJrRqqyQ6TYZGL4TKGzIXfjE", projectId: "myburjo", appId: "1:25464436577:web:89a3105315f8fbcc703720" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const username = localStorage.getItem('myburjo_username');
        if(!username) {
            alert("Kamu harus isi Username dulu di menu Profil sebelum bisa Scan QR!");
            window.location.href = "profile.html";
        }

        let isProcessing = false;

        async function prosesHasilScan(decodedText) {
            if(isProcessing) return;
            isProcessing = true;

            const cleanText = decodedText.trim();

            if (!cleanText.startsWith("MYBURJO")) {
                tampilkanPopupHasil("gagal", "Format QR Code tidak dikenali oleh sistem MYBURJO!");
                return;
            }

            const parts = cleanText.split("-");
            if (parts.length < 4) {
                tampilkanPopupHasil("gagal", "Format QR tidak dikenali. Pastikan ini QR dari meja MyBurjo.");
                return;
            }

            const burjoId = parts[1];
            const nomorMeja = parseInt(parts[3]);
            if (!burjoId || Number.isNaN(nomorMeja)) {
                tampilkanPopupHasil("gagal", "Format QR tidak dikenali. Pastikan ini QR dari meja MyBurjo.");
                return;
            }
            
            try {
                const ref = doc(db, "penjual", burjoId);
                const snap = await getDoc(ref);
                
                if (!snap.exists()) {
                    tampilkanPopupHasil("gagal", "Burjo tidak ditemukan di database.");
                    return;
                }

                const data = snap.data();
                const currentMejaAktif = data.meja_aktif || [];
                const currentDetailMeja = data.detail_meja || [];
                const namaPelanggan = localStorage.getItem('myburjo_username') || 'Pelanggan Anonim';
                const apakahMejaTerisiDiDB = currentMejaAktif.map(n => parseInt(n)).includes(nomorMeja);

                if (!apakahMejaTerisiDiDB) {
                    currentMejaAktif.push(nomorMeja);
                    currentDetailMeja.push({ nomor: nomorMeja, user: namaPelanggan });

                    await updateDoc(ref, {
                        meja_aktif: currentMejaAktif,
                        status_meja: currentMejaAktif.length.toString(),
                        detail_meja: currentDetailMeja
                    });

                    localStorage.setItem('myburjo_checkin', burjoId);
                    tampilkanPopupHasil("checkin", `Meja ${nomorMeja.toString().padStart(2, '0')}`);
                    return;
                }

                const dataMejaIni = currentDetailMeja.find(d => parseInt(d.nomor) === nomorMeja);
                const namaPemakaiDiDB = dataMejaIni?.user || '';

                if (namaPemakaiDiDB === namaPelanggan) {
                    const updatedMejaAktif = currentMejaAktif.filter(n => parseInt(n) !== nomorMeja);
                    const updatedDetailMeja = currentDetailMeja.filter(d => parseInt(d.nomor) !== nomorMeja);

                    await updateDoc(ref, {
                        meja_aktif: updatedMejaAktif,
                        status_meja: updatedMejaAktif.length.toString(),
                        detail_meja: updatedDetailMeja
                    });

                    localStorage.removeItem('myburjo_checkin');
                    tampilkanPopupHasil("checkout", `Meja ${nomorMeja.toString().padStart(2, '0')}`);
                } else {
                    tampilkanPopupHasil("terpakai", `Meja ${nomorMeja.toString().padStart(2, '0')}`);
                }
            } catch(e) {
                console.error(e);
                tampilkanPopupHasil("gagal", "Terjadi masalah saat memproses data server.");
            }
        }

        // Inisialisasi Utama Kamera Live Scanner
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
        html5QrcodeScanner.render((text) => prosesHasilScan(text), (err) => { });

        function tampilkanPopupHasil(tipe, detailInfo) {
            const popup = document.getElementById('popup-scan');
            const iconBox = document.getElementById('popup-icon');
            const titleBox = document.getElementById('popup-title');
            const subtitleBox = document.getElementById('popup-subtitle');

            iconBox.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl ";

            if (tipe === "checkin") {
                iconBox.innerHTML = "🎉";
                iconBox.classList.add("bg-green-50", "text-green-600");
                titleBox.innerText = "Yeay! Berhasil Check-in";
                subtitleBox.innerText = `Kamu berhasil mendaftarkan diri di ${detailInfo}. Silakan scan meja lain jika perlu.`;
            } else if (tipe === "checkout") {
                iconBox.innerHTML = "👋";
                iconBox.classList.add("bg-amber-50", "text-amber-600");
                titleBox.innerText = "Dadah! Berhasil Check-out";
                subtitleBox.innerText = `Akses kamu di ${detailInfo} telah dinonaktifkan. Silakan scan meja lain.`;
            } else if (tipe === "terpakai") {
                iconBox.innerHTML = "⚠️";
                iconBox.classList.add("bg-red-50", "text-red-600");
                titleBox.innerText = "Yah! Meja masih dipake";
                subtitleBox.innerText = `${detailInfo} masih digunakan orang lain. Coba meja lain.`;
            } else {
                iconBox.innerHTML = "❌";
                iconBox.classList.add("bg-gray-100", "text-gray-600");
                titleBox.innerText = "Proses Gagal";
                subtitleBox.innerText = detailInfo;
            }

            popup.classList.remove('hidden');
            popup.classList.add('flex');
        }

        window.tutupPopupDanSelesai = function() {
            const popup = document.getElementById('popup-scan');
            popup.classList.add('hidden');
            popup.classList.remove('flex');
            
            // Jeda 1.5 detik sebelum gembok dibuka agar kamera tidak memindai instan objek yang sama
            setTimeout(() => {
                isProcessing = false;
            }, 1500);
        }

        // AMAN & BEBAS BENTROK: Inisialisasi engine khusus galeri pada div dummy terpisah
        const html5QrCode = new window.Html5Qrcode("file-reader-dummy");
        const fileInput = document.getElementById('file-qr');
        
        document.getElementById('btn-scan-galeri').addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', e => {
            if (e.target.files.length == 0) { return; }
            const imageFile = e.target.files[0];
            
            html5QrCode.scanFile(imageFile, true)
                .then(decodedText => {
                    prosesHasilScan(decodedText);
                })
                .catch(err => {
                    tampilkanPopupHasil("gagal", "QR Code tidak terbaca. Pastikan gambarnya jelas ya.");
                });
            
            e.target.value = ""; 
        });
    </script>
</body>
</html>
