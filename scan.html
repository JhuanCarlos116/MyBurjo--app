<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Scan QR - MYBURJO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #fff9ef; color: #1f1b11; }
        #reader { width: 100%; border-radius: 24px; overflow: hidden; border: 4px solid #ffd700; background: #1f1b11; }
        #reader video { object-fit: cover; border-radius: 20px; }
        #reader__dashboard_section_csr span, 
        #reader__dashboard_section_swaplink { display: none !important; }
        #reader__dashboard_section_csr button { 
            background: #ffd700 !important; color: #1f1b11 !important; 
            font-weight: bold; border-radius: 8px; padding: 8px 16px; margin-top: 10px;
        }
    </style>
</head>
<body class="antialiased pb-32">
    
    <header class="bg-white sticky top-0 z-50 py-4 shadow-sm flex items-center justify-center gap-2 border-b border-[#f5eddb] px-5">
        <div class="w-10 h-10 rounded-full bg-[#ffd700] flex items-center justify-center border-2 border-white shadow-sm">
            <span class="material-symbols-outlined text-[#1f1b11]">qr_code_scanner</span> 
        </div>
        <h1 class="font-black text-2xl tracking-tighter text-[#1f1b11]">Scan QR Meja</h1> 
    </header>

    <main class="px-6 mt-8 flex flex-col items-center">
        <div id="reader" class="w-full max-w-sm rounded-[24px] overflow-hidden border-4 border-[#f5eddb] bg-white shadow-lg min-h-[250px] flex items-center justify-center relative">
            <span id="loading-cam" class="material-symbols-outlined text-[#d1c8b4] text-5xl animate-pulse absolute">qr_code_scanner</span>
        </div>

        <p class="text-center text-[#7e7760] font-semibold text-sm mt-6 mb-6 px-4">
            Arahkan kamera ke QR Code yang ada di mejamu untuk Check-in atau Check-out.
        </p>

        <input type="file" id="upload-qr" accept="image/*" class="hidden">
        <button onclick="document.getElementById('upload-qr').click()" class="w-full max-w-sm bg-white text-[#1f1b11] py-4 rounded-2xl font-bold border-2 border-[#f5eddb] shadow-sm flex items-center justify-center gap-2 active:scale-95 transition-all">
            <span class="material-symbols-outlined text-[#705d00]">image</span> Pilih dari Galeri
        </button>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-[#f5eddb] h-20 flex justify-around items-center z-[100] shadow-[0_-4px_20px_rgba(0,0,0,0.03)] px-6">
    <a href="index.html" class="flex flex-col items-center gap-1 text-[#d1c8b4] hover:text-[#705d00] transition-colors">
        <span class="material-symbols-outlined text-2xl">home</span>
        <span class="text-[10px] font-bold">Home</span>
    </a>

    <a href="scan.html" class="relative -top-5">
        <div class="bg-[#ffd700] text-[#1f1b11] w-14 h-14 rounded-full flex items-center justify-center shadow-lg border-4 border-white active:scale-95 transition-transform">
            <span class="material-symbols-outlined text-2xl">qr_code_scanner</span>
        </div>
    </a>

    <a href="profile.html" class="flex flex-col items-center gap-1 text-[#d1c8b4] hover:text-[#705d00] transition-colors">
        <span class="material-symbols-outlined text-2xl">person</span>
        <span class="text-[10px] font-bold">Profil</span>
    </a>
</nav>

    <div id="custom-alert" class="fixed inset-0 bg-[#1f1b11]/80 z-[200] hidden items-center justify-center px-6 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 flex flex-col items-center text-center shadow-2xl transform scale-90 transition-transform duration-300" id="alert-box">
            <div id="alert-icon-container" class="w-16 h-16 rounded-full flex items-center justify-center mb-4">
                <span id="alert-icon" class="material-symbols-outlined text-4xl">info</span>
            </div>
            <h2 id="alert-title" class="font-extrabold text-xl text-[#1f1b11] mb-2">Judul</h2>
            <p id="alert-message" class="text-sm font-medium text-[#7e7760] mb-6">Pesan detail akan muncul di sini.</p>
            <button id="btn-alert-close" class="w-full bg-[#ffd700] text-[#705d00] py-3 rounded-xl font-bold shadow-sm active:scale-95 transition-all">Mengerti</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLmFSnIL4NJrRqqyQ6TYZGL4TKGzIXfjE",
            projectId: "myburjo",
            appId: "1:25464436577:web:89a3105315f8fbcc703720"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let fungsiCallbackTutup = null;

        window.tampilkanPopup = (judul, pesan, tipe = 'info', callback = null) => {
            document.getElementById('alert-title').innerText = judul;
            document.getElementById('alert-message').innerText = pesan;
            const icon = document.getElementById('alert-icon');
            const container = document.getElementById('alert-icon-container');
            fungsiCallbackTutup = callback;

            if (tipe === 'sukses') {
                icon.innerText = 'check_circle';
                container.className = 'w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-green-100 text-green-600';
            } else if (tipe === 'error') {
                icon.innerText = 'sentiment_very_dissatisfied';
                container.className = 'w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-red-100 text-red-600';
            } else {
                icon.innerText = 'waving_hand';
                container.className = 'w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-blue-100 text-blue-600';
            }

            const modal = document.getElementById('custom-alert');
            const box = document.getElementById('alert-box');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-90');
            }, 10);
        };

        window.tutupPopup = () => {
            const modal = document.getElementById('custom-alert');
            const box = document.getElementById('alert-box');
            modal.classList.add('opacity-0');
            box.classList.add('scale-90');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                if (fungsiCallbackTutup) fungsiCallbackTutup();
            }, 300);
        };

        document.getElementById('btn-alert-close').addEventListener('click', tutupPopup);

        document.addEventListener("DOMContentLoaded", function() {
            const html5QrCode = new Html5Qrcode("reader");
            const configKamera = { fps: 10, qrbox: { width: 250, height: 250 } };

            html5QrCode.start(
                { facingMode: "environment" },
                configKamera,
                (decodedText) => {
                    html5QrCode.stop();
                    prosesDataQR(decodedText);
                },
                (errorMessage) => {
                    // Kamera mencari QR, tidak perlu ditampilkan ke pengguna.
                }
            ).then(() => {
                document.getElementById('loading-cam').style.display = 'none';
            }).catch((err) => {
                document.getElementById('loading-cam').style.display = 'none';
                tampilkanPopup("Kamera Diblokir", "Mohon berikan izin akses kamera pada browser HP Anda.", "error");
            });

            document.getElementById('upload-qr').addEventListener('change', e => {
                if (e.target.files.length === 0) return;
                const imageFile = e.target.files[0];
                html5QrCode.scanFile(imageFile, true)
                    .then(decodedText => {
                        prosesDataQR(decodedText);
                    })
                    .catch(err => {
                        tampilkanPopup("Gagal Membaca", "Tidak ditemukan kode QR pada foto yang kamu pilih.", "error");
                    });
                e.target.value = "";
            });

            async function prosesDataQR(teksQR) {
                if (!teksQR.startsWith("MYBURJO")) {
                    tampilkanPopup("QR Tidak Valid", "Kode QR ini bukan milik sistem MyBurjo.", "error", () => location.reload());
                    return;
                }

                const bagian = teksQR.split('-');
                const burjoId = bagian[1];
                const nomorMeja = parseInt(bagian[3]);
                const currentUsername = localStorage.getItem("myburjo_username") || "Pengguna";

                if (!burjoId || !nomorMeja) {
                    tampilkanPopup("Gagal Membaca", "Data QR meja rusak.", "error", () => location.reload());
                    return;
                }

                try {
                    const docRef = doc(db, "penjual", burjoId);
                    const snap = await getDoc(docRef);
                    if (!snap.exists()) {
                        tampilkanPopup("Warung Tidak Ada", "ID Mitra Burjo tidak terdaftar.", "error", () => location.reload());
                        return;
                    }

                    const data = snap.data();
                    let mejaAktif = data.meja_aktif || [];
                    let detailMeja = data.detail_meja || [];
                    const infoMeja = detailMeja.find(item => item.nomor === nomorMeja);
                    const indexMejaTerpakai = mejaAktif.indexOf(nomorMeja);

                    if (indexMejaTerpakai > -1) {
                        if (infoMeja && infoMeja.user === currentUsername) {
                            mejaAktif = mejaAktif.filter(n => n !== nomorMeja);
                            detailMeja = detailMeja.filter(d => d.nomor !== nomorMeja);
                            await updateDoc(docRef, {
                                meja_aktif: mejaAktif,
                                detail_meja: detailMeja,
                                status_meja: mejaAktif.length.toString()
                            });
                            tampilkanPopup("Check-out Berhasil", "Terima kasih, kamu sudah keluar dari meja.", "info", () => {
                                window.location.href = "index.html";
                            });
                        } else {
                            tampilkanPopup("Meja Sedang Dipakai", "Meja ini sudah dipesan oleh pengguna lain.", "error", () => {
                                window.location.href = "index.html";
                            });
                        }
                    } else {
                        mejaAktif.push(nomorMeja);
                        detailMeja = detailMeja.filter(d => d.nomor !== nomorMeja);
                        detailMeja.push({ nomor: nomorMeja, user: currentUsername });
                        await updateDoc(docRef, {
                            meja_aktif: mejaAktif,
                            detail_meja: detailMeja,
                            status_meja: mejaAktif.length.toString()
                        });
                        tampilkanPopup("Check-in Berhasil", "Selamat! Kamu berhasil check-in.", "sukses", () => {
                            window.location.href = "index.html";
                        });
                    }
                } catch (error) {
                    console.error(error);
                    tampilkanPopup("Error Sistem", "Gagal berkomunikasi dengan database.", "error", () => location.reload());
                }
            }
        });
    </script>
</body>
</html>
