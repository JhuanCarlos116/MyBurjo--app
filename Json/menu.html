<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Menu - MYBURJO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #fff9ef; }
        .tab-active { background-color: white; color: #705d00; font-weight: 600; box-shadow: 0 4px 15px rgba(31, 27, 17, 0.06); }
        .meja-box { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .meja-selected { transform: scale(1.1); border: 3px solid #705d00 !important; z-index: 10; }
    </style>
</head>
<body class="pb-40">
    <header class="bg-white sticky top-0 z-50 px-6 py-4 flex items-center justify-between border-b border-[#f5eddb]">
        <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-[#fff9ef] text-[#1f1b11]"><span class="material-symbols-outlined">arrow_back</span></button>
        <h1 id="nama-burjo" class="font-bold text-lg text-[#1f1b11]">Memuat...</h1>
        <div class="w-10"></div>
    </header>

    <main class="p-5 space-y-8 text-center">
        <div class="flex justify-center">
            <span id="status-pill" class="inline-flex items-center px-6 py-2.5 rounded-full font-bold text-sm bg-white border border-[#f5eddb] shadow-sm uppercase tracking-wide text-[#705d00]">
                <span id="text-status">MENUNGGU DATA...</span>
            </span>
        </div>

        <div class="p-5 bg-white rounded-[24px] shadow-sm border border-[#f5eddb] space-y-5">
            <div class="flex justify-between items-center text-[10px] font-bold uppercase text-[#7e7760] tracking-widest border-b pb-3">
                <span>Klik meja untuk detail fasilitas</span>
                <div class="flex gap-4">
                    <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-[#ffd700]"></div> TERSEDIA</div>
                    <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-[#f5eddb]"></div> TERPAKAI</div>
                </div>
            </div>
            
            <div id="grid-meja" class="grid grid-cols-5 gap-3"></div>

            <div id="box-fasilitas" class="bg-[#fff9ef] p-5 rounded-2xl text-left border-2 border-dashed border-[#f5eddb]">
                <p class="text-[10px] font-black text-[#705d00] uppercase mb-1 tracking-tighter">Informasi Fasilitas Meja:</p>
                <p id="deskripsi-meja" class="text-sm text-[#1f1b11] font-medium leading-relaxed">Silakan klik salah satu kotak nomor meja di atas.</p>
            </div>
        </div>

        <div class="flex p-1.5 bg-[#f5eddb] rounded-2xl">
            <button onclick="gantiTab('Makanan')" id="tab-makan" class="flex-1 py-3.5 rounded-xl transition-all tab-active">Makanan</button>
            <button onclick="gantiTab('Minuman')" id="tab-minum" class="flex-1 py-3.5 rounded-xl text-[#7e7760]">Minuman</button>
        </div>
        <div id="daftar-menu" class="space-y-4 text-left"></div>
    </main>

    <div class="fixed bottom-10 left-0 right-0 px-6">
        <button id="btn-gas" class="w-full bg-[#705d00] text-white py-5 rounded-[24px] font-bold flex items-center justify-center gap-3 shadow-xl active:scale-95 transition-all">
            <span class="material-symbols-outlined">navigation</span> GAS KESANA!
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCLmFSnIL4NJrRqqyQ6TYZGL4TKGzIXfjE", 
            projectId: "myburjo", 
            appId: "1:25464436577:web:89a3105315f8fbcc703720" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const urlParams = new URLSearchParams(window.location.search);
        const burjoId = urlParams.get('id') || "12052601";
        
        let allMenu = [];
        let listDeskripsi = [];
        let tabSekarang = 'Makanan'; // Menyimpan state tab aktif

        window.pilihMeja = (index) => {
            const rawText = listDeskripsi[index] || "Informasi meja tidak tersedia.";
            const cleanText = rawText.includes(':') ? rawText.split(', ')[1] || rawText : rawText;
            document.getElementById('deskripsi-meja').innerText = cleanText;
            
            document.querySelectorAll('.meja-box').forEach(el => el.classList.remove('meja-selected'));
            document.getElementById(`meja-${index}`).classList.add('meja-selected');
        };

        window.gantiTab = (k) => {
            tabSekarang = k;
            document.getElementById('tab-makan').className = k === 'Makanan' ? "flex-1 py-3.5 rounded-xl tab-active" : "flex-1 py-3.5 rounded-xl text-[#7e7760] font-semibold";
            document.getElementById('tab-minum').className = k === 'Minuman' ? "flex-1 py-3.5 rounded-xl tab-active" : "flex-1 py-3.5 rounded-xl text-[#7e7760] font-semibold";
            renderMenu(k);
        };

        function renderMenu(k) {
            const c = document.getElementById('daftar-menu'); 
            c.innerHTML = "";
            
            const filteredMenu = allMenu.filter(m => m.kategori === k);
            
            if (filteredMenu.length === 0) {
                c.innerHTML = `<div class="py-10 text-center opacity-40 text-sm italic font-medium">Menu belum tersedia.</div>`;
                return;
            }

            filteredMenu.forEach(item => {
                const imgUrl = item.foto || '';
                // Deteksi status aktif/nonaktif dari penjual
                const isTersedia = item.status !== 'nonaktif';

                c.innerHTML += `
                    <div class="bg-white p-4 rounded-[24px] flex gap-4 items-center shadow-sm border border-[#f5eddb] relative overflow-hidden">
                        
                        <div class="w-20 h-20 bg-[#f5eddb] rounded-[16px] flex-shrink-0 flex items-center justify-center text-[#e1d9c8] overflow-hidden relative">
                            ${imgUrl ? `<img src="${imgUrl}" alt="${item.nama}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                        <span class="material-symbols-outlined text-3xl" style="display:none;">image</span>` 
                                     : `<span class="material-symbols-outlined text-3xl">image</span>`}
                            
                            ${!isTersedia ? `
                            <div class="absolute inset-0 bg-black/40 backdrop-blur-[1px] flex items-center justify-center">
                                <span class="bg-red-600 text-white font-black text-[9px] tracking-wider uppercase px-2 py-0.5 rounded shadow-sm">Habis</span>
                            </div>` : ''}
                        </div>
                        
                        <div class="flex-1 min-w-0 ${!isTersedia ? 'opacity-40' : ''}">
                            <h4 class="font-bold text-[#1f1b11] truncate">${item.nama}</h4>
                            ${item.deskripsi ? `<p class="text-[10px] text-[#7e7760] mt-0.5 line-clamp-1">${item.deskripsi}</p>` : ''}
                            <p class="text-[#705d00] text-sm font-bold mt-1">Rp ${item.harga.toLocaleString('id-ID')}</p>
                        </div>
                    </div>`;
            });
        }

        // FUNGSI REAL-TIME INTEGRATION
        function initRealtime() {
            const docRef = doc(db, "penjual", burjoId);
            
            onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    document.getElementById('nama-burjo').innerText = data.nama_burjo;
                    listDeskripsi = data.deskripsi_meja || [];
                    
                    const mejaAktif = data.meja_aktif || [];
                    // SEKARANG DINAMIS: Mengikuti jumlah data di katalog meja
                    const totalMeja = listDeskripsi.length; 
                    const tersedia = totalMeja - mejaAktif.length;
                    
                    document.getElementById('text-status').innerText = `${tersedia}/${totalMeja} MEJA TERSEDIA`;
                    
                    // Perbaikan Link Google Maps sekalian (ada typo bawaan di filemu)
                    if(data.lokasi) {
                        document.getElementById('btn-gas').onclick = () => window.open(`https://www.google.com/maps/search/?api=1&query=${data.lokasi.latitude},${data.lokasi.longitude}`, '_blank');
                    }

                    const grid = document.getElementById('grid-meja');
                    grid.innerHTML = "";
                    // Loop dinamis sesuai total meja yang ada di database
                    for(let i = 1; i <= totalMeja; i++) {
                        const isTerpakai = mejaAktif.includes(i.toString()) || mejaAktif.includes(i);
                        grid.innerHTML += `
                            <div id="meja-${i-1}" onclick="pilihMeja(${i-1})" 
                                 class="meja-box aspect-square flex items-center justify-center rounded-xl font-bold text-xs shadow-sm
                                 ${isTerpakai ? 'bg-[#f5eddb] text-[#e1d9c8] pointer-events-none' : 'bg-[#ffd700] text-[#1f1b11]'}">
                                 ${i}
                            </div>`;
                    }
                }
            });

            // DIUBAH KE REAL-TIME: Menggunakan onSnapshot agar perubahan status/foto menu langsung ter-update otomatis di pembeli
            const menuRef = collection(db, "penjual", burjoId, "katalog_menu");
            onSnapshot(menuRef, (mSnap) => {
                allMenu = [];
                mSnap.forEach(m => allMenu.push(m.data())); 
                renderMenu(tabSekarang);
            });
        }

        // Jalankan Semuanya
        initRealtime();
    </script>
</body>
</html>
