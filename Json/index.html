<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>MYBURJO - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #fff9ef; color: #1f1b11; overflow-x: hidden; }
        h1, h2 { font-family: 'Plus Jakarta Sans', sans-serif; }
        #map { height: 250px; width: 100%; z-index: 10; border-bottom: 2px solid #e1d9c8; }
        .ambient-shadow { box-shadow: 0 4px 20px rgba(31, 27, 17, 0.08); }
        .card-radius { border-radius: 24px; }
        .custom-tooltip { background: #ffd700; border: none; font-weight: 700; border-radius: 8px; color: #1f1b11; padding: 4px 8px; }

        /* ==========================================
           CSS ANIMASI SPLASH SCREEN (OPENING)
           ========================================== */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #fff9ef; z-index: 99999; 
            display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem;
        }
        .logo-wrapper { position: relative; }
        .logo-circle {
            width: 130px; height: 130px; background-color: #ffd700; border: 6px solid white; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 15px 35px rgba(255, 215, 0, 0.4);
            transform: scale(0);
            animation: boom 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .logo-icon { font-size: 70px; color: #1f1b11; }
        .logo-wrapper::before {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 130px; height: 130px; background: #ffd700; border-radius: 50%;
            transform: translate(-50%, -50%) scale(1); z-index: -1;
            animation: shockwave 1.2s ease-out 0.2s forwards;
        }
        .brand-text {
            color: #1f1b11; font-size: 3.5rem; font-weight: 800; letter-spacing: -0.05em; margin: 0; opacity: 0;
            animation: slideUpSpring 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
        }
        @keyframes boom { 0% { transform: scale(0) rotate(-45deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
        @keyframes shockwave { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; } 100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; } }
        @keyframes slideUpSpring { 0% { transform: translateY(60px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        
        .zoom-out { animation: zoomOutFast 0.6s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards; pointer-events: none; }
        @keyframes zoomOutFast { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }
    </style>
</head>
<body class="antialiased pb-32">

    <div id="splash-screen">
        <div class="logo-wrapper">
            <div class="logo-circle">
                <span class="material-symbols-outlined logo-icon">soup_kitchen</span>
            </div>
        </div>
        <h1 class="brand-text">MYBURJO</h1>
    </div>

    <header class="bg-white sticky top-0 z-[100] py-4 shadow-sm flex items-center justify-center gap-2 border-b border-[#f5eddb]">
        <div class="w-10 h-10 rounded-full bg-[#ffd700] flex items-center justify-center border-2 border-white"><span class="material-symbols-outlined text-[#1f1b11]">soup_kitchen</span></div>
        <h1 class="font-extrabold text-2xl tracking-tighter text-[#1f1b11]">MYBURJO</h1>
    </header>

    <div class="px-5 mt-5">
        <div class="bg-white p-3 rounded-2xl ambient-shadow border border-[#e5dfd3] flex items-center gap-3">
            <span class="material-symbols-outlined text-[#7e7760]">search</span>
            <input type="text" id="search-input" placeholder="Cari burjo terdekat..." class="w-full bg-transparent outline-none text-sm font-medium">
        </div>
    </div>

    <div id="map" class="mt-5"></div>
    
    <main id="daftar-burjo" class="px-5 mt-6 space-y-6">
        <p class="text-center text-[#7e7760] py-10 animate-pulse italic">Mencari Burjo favoritmu...</p>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-[#f5eddb] h-20 flex justify-around items-center z-[100] shadow-[0_-4px_20px_rgba(0,0,0,0.03)] px-6">
    <a href="index.html" class="flex flex-col items-center gap-1 text-[#d1c8b4] hover:text-[#705d00] transition-colors">
        <span class="material-symbols-outlined text-2xl">home</span>
        <span class="text-[10px] font-bold">Home</span>
    </a>

    <a href="scan.html" class="relative -top-5">
        <div class="bg-[#ffd700] text-[#1f1b11] w-14 h-14 rounded-full flex items-center justify-center shadow-lg border-4 border-white active:scale-95 transition-transform">
            <span class="material-symbols-outlined text-2xl">qr_code_scanner</span>
        </div>
    </a>

    <a href="profile.html" class="flex flex-col items-center gap-1 text-[#d1c8b4] hover:text-[#705d00] transition-colors">
        <span class="material-symbols-outlined text-2xl">person</span>
        <span class="text-[10px] font-bold">Profil</span>
    </a>
</nav>

    <script>
        const splash = document.getElementById('splash-screen');

        // Cek apakah user sudah pernah melihat splash screen di sesi ini
        if (!sessionStorage.getItem('splashShown')) {
            // Jika BELUM PERNAH (Baru masuk aplikasi)
            splash.style.display = 'flex'; // Tampilkan splash screen
            document.body.style.overflow = 'hidden'; // Kunci scroll layar saat animasi

            setTimeout(() => {
                splash.classList.add('zoom-out');
                setTimeout(() => {
                    splash.style.display = 'none'; 
                    document.body.style.overflow = 'auto'; // Buka kembali kunci scroll
                    
                    // Tandai bahwa splash screen sudah pernah ditampilkan
                    sessionStorage.setItem('splashShown', 'true');
                }, 600);
            }, 2200); // Tampil selama 2.2 detik
        } else {
            // Jika SUDAH PERNAH (Pindah dari halaman lain), langsung hilangkan splash screen
            splash.style.display = 'none';
            document.body.style.overflow = 'auto';
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCLmFSnIL4NJrRqqyQ6TYZGL4TKGzIXfjE", projectId: "myburjo", appId: "1:25464436577:web:89a3105315f8fbcc703720" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const map = L.map('map', { zoomControl: false }).setView([-7.051, 110.438], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        const markerGroup = L.layerGroup().addTo(map);

        let userPos = null, lastSnap = null, term = "";

        function hitungJarak(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2-lat1) * Math.PI/180;
            const dLon = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(2);
        }

        window.fokusPeta = (lat, lng) => {
            map.flyTo([lat, lng], 18, { animate: true, duration: 1.5 });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        function getStatus(dataBurjo) {
            // 1. Ambil total meja secara dinamis dari database (jika tidak ada, default 10)
            const totalMeja = (dataBurjo.deskripsi_meja && Array.isArray(dataBurjo.deskripsi_meja))
                ? dataBurjo.deskripsi_meja.length
                : 10;

            // 2. Cek berapa meja yang sedang dipakai
            let terpakai = 0;
            if (dataBurjo.meja_aktif && Array.isArray(dataBurjo.meja_aktif)) {
                terpakai = dataBurjo.meja_aktif.length;
            } else if (dataBurjo.status_meja) {
                const strStatus = String(dataBurjo.status_meja);
                if (strStatus.includes('/')) {
                    terpakai = parseInt(strStatus.split('/')[0]) || 0;
                } else {
                    terpakai = parseInt(strStatus) || 0;
                }
            }

            if (terpakai < 0) terpakai = 0;
            if (terpakai > totalMeja) terpakai = totalMeja;

            const tersedia = totalMeja - terpakai;
            const persen = totalMeja === 0 ? 0 : (terpakai / totalMeja) * 100;
            let config = { tableText: `${tersedia}/${totalMeja} TERSEDIA`, crowdText: "", style: "" };
            
            if (persen <= 25) { config.crowdText = "SEPI"; config.style = "bg-[#e8f5e9] text-[#2e7d32] border-[#c8e6c9]"; }
            else if (persen <= 75) { config.crowdText = "LUMAYAN"; config.style = "bg-[#fffde7] text-[#f57f17] border-[#fff9c4]"; }
            else { config.crowdText = "RAME"; config.style = "bg-[#ffebee] text-[#c62828] border-[#ffcdd2]"; }
            
            return config;
        }

        function render(snap, s = "") {
            const container = document.getElementById('daftar-burjo');
            container.innerHTML = "";
            markerGroup.clearLayers();

            if (!snap) return;

            let daftarBurjo = [];

            snap.forEach(doc => {
                const d = doc.data();
                if (s && !d.nama_burjo.toLowerCase().includes(s.toLowerCase())) return;

                const lat = d.lokasi.latitude, lng = d.lokasi.longitude;
                let nilaiJarak = 999999; 
                let teksJarak = "--";

                if (userPos) {
                    const jarakDihitung = hitungJarak(userPos.lat, userPos.lng, lat, lng);
                    nilaiJarak = parseFloat(jarakDihitung);
                    teksJarak = jarakDihitung;
                }

                daftarBurjo.push({ id: doc.id, ...d, lat, lng, nilaiJarak, teksJarak });
            });

            daftarBurjo.sort((a, b) => a.nilaiJarak - b.nilaiJarak);

            daftarBurjo.forEach(d => {
                // Mengambil status dari seluruh data (d), bukan sekadar string
                const st = getStatus(d);

                L.circleMarker([d.lat, d.lng], { radius: 8, fillColor: "#705d00", color: "#fff", weight: 2, fillOpacity: 1 }).addTo(markerGroup)
                 .bindTooltip(d.nama_burjo, { permanent: true, direction: 'top', className: 'custom-tooltip' });

                const linkFoto = d.photo_url || d.foto_profil || d.foto || d.gambar || d.profile_picture || d.image_url;
                const htmlThumbnail = linkFoto
                    ? `<img src="${linkFoto}" alt="${d.nama_burjo}" class="w-14 h-16 rounded-2xl object-cover border border-[#f0e7d6]" />`
                    : `<div class="w-14 h-16 bg-[#fff9ef] rounded-2xl flex items-center justify-center text-[#705d00] border border-[#f0e7d6]"><span class="material-symbols-outlined text-3xl">soup_kitchen</span></div>`;

                container.innerHTML += `
                    <div class="bg-white card-radius p-5 ambient-shadow border border-[#f5eddb] flex flex-col gap-4 relative">
                        <div class="flex justify-between items-start">
                            <div class="flex gap-4">
                                ${htmlThumbnail}
                                <div>
                                    <h2 class="font-bold text-xl text-[#1f1b11]">${d.nama_burjo}</h2>
                                    <p class="text-xs text-[#7e7760] mt-1 font-semibold italic">📍 ${d.teksJarak} km dari kamu</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="fokusPeta(${d.lat}, ${d.lng})" class="w-10 h-10 flex items-center justify-center rounded-xl bg-orange-50 text-[#705d00] border border-orange-100 shadow-sm active:scale-95 transition-all"><span class="material-symbols-outlined">location_on</span></button>

                                <div class="flex flex-col items-center justify-center border p-2 rounded-xl min-w-[100px] ${st.style} shadow-sm leading-none">
                                    <span class="text-[10px] font-extrabold tracking-tight mb-1">${st.tableText}</span>
                                    <div class="w-full border-b border-current opacity-20"></div>
                                    <span class="text-[11px] font-black mt-1">${st.crowdText}</span>
                                </div>
                            </div>
                        </div>
                        <a href="menu.html?id=${d.id}" class="w-full bg-[#ffd700] text-[#1f1b11] py-4 rounded-2xl font-bold text-center shadow-md active:scale-95 transition-all">Lihat Menu & Meja</a>
                    </div>`;
            });
        }

        onSnapshot(collection(db, "penjual"), s => { lastSnap = s; render(s, term); });
        navigator.geolocation.getCurrentPosition(p => { 
            userPos = { lat: p.coords.latitude, lng: p.coords.longitude }; 
            L.marker([userPos.lat, userPos.lng], {icon: L.icon({iconUrl: 'https://cdn-icons-png.flaticon.com/512/1673/1673188.png', iconSize: [30, 30]})}).addTo(map);
            if(lastSnap) render(lastSnap, term); 
        });
        document.getElementById('search-input').addEventListener('input', e => { term = e.target.value; render(lastSnap, term); });
    </script>
</body>
</html>
