<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Laman Utama Penjual - MYBURJO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #fff9ef; color: #1f1b11; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
        .ambient-shadow { box-shadow: 0 4px 20px rgba(31, 27, 17, 0.08); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased pb-32">
    
    <header class="bg-white sticky top-0 z-50 px-6 py-4 flex items-center justify-between border-b border-[#f5eddb] shadow-sm">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-full bg-[#ffd700] flex items-center justify-center border-2 border-[#1f1b11]">
                <span class="material-symbols-outlined text-[#1f1b11]">storefront</span>
            </div>
            <div>
                <h1 id="nama-toko" class="font-extrabold text-lg tracking-tighter leading-none">Memuat...</h1>
                <p class="text-xs font-semibold text-[#7e7760] mt-1">ID: <span id="display-id" class="text-[#705d00]">--------</span></p>
            </div>
        </div>
        <button onclick="window.location.href='profile.html'" class="w-10 h-10 flex items-center justify-center rounded-xl bg-[#fff9ef] text-[#dc2626]">
            <span class="material-symbols-outlined">logout</span>
        </button>
    </header>

    <main class="p-5 space-y-6">
        <section class="bg-white p-5 rounded-2xl ambient-shadow border border-[#e5dfd3]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-lg text-[#1f1b11]">Status Meja & Pengguna</h2>
                <span id="indikator-jumlah" class="px-3 py-1 bg-[#fff9ef] text-[#705d00] rounded-full text-[10px] font-black border border-[#f5eddb]">0/10 TERPAKAI</span>
            </div>
            
            <div id="container-meja" class="flex gap-4 overflow-x-auto hide-scroll pb-2 snap-x">
                </div>
        </section>

        <section class="grid grid-cols-2 gap-4">
            <a href="edit-katalog-meja.html" class="bg-white p-5 rounded-2xl ambient-shadow border border-[#e5dfd3] flex flex-col items-center gap-3 active:scale-95 transition-all text-center">
                <span class="material-symbols-outlined text-[#705d00]">table_restaurant</span>
                <h3 class="font-bold text-xs">Edit Katalog Meja</h3>
            </a>
            <a href="edit-katalog-menu.html" class="bg-white p-5 rounded-2xl ambient-shadow border border-[#e5dfd3] flex flex-col items-center gap-3 active:scale-95 transition-all text-center">
                <span class="material-symbols-outlined text-[#705d00]">restaurant_menu</span>
                <h3 class="font-bold text-xs">Katalog Menu</h3>
            </a>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCLmFSnIL4NJrRqqyQ6TYZGL4TKGzIXfjE", 
            projectId: "myburjo", 
            appId: "1:25464436577:web:89a3105315f8fbcc703720" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const burjoId = urlParams.get('id') || "12052601"; 
        const docRef = doc(db, "penjual", burjoId);

        let listMejaTerpakai = [];

        onSnapshot(docRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();
                document.getElementById('nama-toko').innerText = data.nama_burjo;
                document.getElementById('display-id').innerText = burjoId;
                
                // Ambil daftar nomor meja yang sedang terisi dari field 'meja_aktif'
                listMejaTerpakai = data.meja_aktif || []; 
                const detailUser = data.detail_meja || [];
                renderMeja(listMejaTerpakai, detailUser);
            }
        });

        function renderMeja(listTerpakai, detailUser) {
            const container = document.getElementById('container-meja');
            document.getElementById('indikator-jumlah').innerText = `${listTerpakai.length}/10 TERPAKAI`;
            container.innerHTML = "";

            for (let i = 1; i <= 10; i++) {
                const isTerpakai = listTerpakai.includes(i);
                const dataUser = detailUser.find(d => d.nomor == i);
                const username = isTerpakai ? (dataUser?.user || "Pelanggan") : "-";

                container.innerHTML += `
                    <div class="min-w-[155px] snap-center p-5 rounded-2xl border-2 ${isTerpakai ? 'border-[#f5eddb] bg-[#f5eddb]' : 'border-[#ffd700] bg-white'} flex flex-col items-center shadow-sm">
                        <span class="text-[10px] font-bold text-[#7e7760] mb-1">MEJA ${i.toString().padStart(2, '0')}</span>
                        
                        <div class="h-10 flex items-center justify-center text-center mb-2">
                            <p class="text-[11px] font-black text-[#1f1b11]">
                                ${isTerpakai ? '<span class="material-symbols-outlined text-[14px] align-middle mr-1">person</span>' + username : '<span class="text-[#d1c8b4]">Kosong</span>'}
                            </p>
                        </div>

                        <div class="px-3 py-1 rounded-full text-[9px] font-black mb-4 ${isTerpakai ? 'bg-[#705d00] text-white' : 'bg-[#1f1b11] text-[#ffd700]'}">
                            ${isTerpakai ? 'TERPAKAI' : 'TERSEDIA'}
                        </div>

                        ${isTerpakai 
                            ? `<button onclick="prosesMeja(${i}, 'lepas')" class="w-full bg-white text-[#dc2626] border border-[#dc2626] py-2 rounded-xl text-[10px] font-bold active:scale-95 shadow-sm">Kosongkan</button>`
                            : `<button onclick="prosesMeja(${i}, 'isi')" class="w-full bg-[#ffd700] text-[#1f1b11] py-2 rounded-xl text-[10px] font-bold active:scale-95 shadow-sm">Set Terpakai</button>`
                        }
                    </div>
                `;
            }
        }

        window.prosesMeja = async (nomor, aksi) => {
            let newList = [...listMejaTerpakai];
            
            if (aksi === 'lepas') {
                // Menghapus hanya nomor meja yang diklik dari daftar
                newList = newList.filter(n => n !== nomor);
            } else {
                if (!newList.includes(nomor)) newList.push(nomor);
            }

            try {
                await updateDoc(docRef, {
                    meja_aktif: newList,
                    status_meja: newList.length.toString() // Agar indikator di halaman depan tetap update
                });
            } catch (e) {
                console.error("Gagal update meja:", e);
            }
        };
    </script>
</body>
</html>
