    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    
    <style>
        body { 
            background-color: #fff9ef; 
            margin: 0;
            overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        
        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 1.5rem;
            transform-origin: center;
        }

        .logo-wrapper {
            position: relative;
        }

        .logo-circle {
            width: 130px;
            height: 130px;
            background-color: #ffd700;
            border: 6px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 35px rgba(255, 215, 0, 0.4);
            transform: scale(0);
            animation: boom 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .logo-icon {
            font-size: 70px;
            color: #1f1b11;
        }

        .logo-wrapper::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 130px; height: 130px;
            background: #ffd700;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(1);
            z-index: -1;
            animation: shockwave 1.2s ease-out 0.2s forwards;
        }

        .brand-text {
            color: #1f1b11;
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin: 0;
            opacity: 0;
            animation: slideUpSpring 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
        }

        @keyframes boom {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes shockwave {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }

        @keyframes slideUpSpring {
            0% { transform: translateY(60px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .zoom-out {
            animation: zoomOutFast 0.6s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
        }
        @keyframes zoomOutFast {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }
    </style>
</head>
