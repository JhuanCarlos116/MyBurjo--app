<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Profile - MYBURJO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #fff9ef; color: #1f1b11; }
        .ambient-shadow { box-shadow: 0 4px 20px rgba(31, 27, 17, 0.08); }
    </style>
</head>
    <header class="bg-white sticky top-0 z-50 py-4 shadow-sm flex items-center justify-center gap-2 border-b border-[#f5eddb]">
        <div class="w-10 h-10 rounded-full bg-[#ffd700] flex items-center justify-center border-2 border-white shadow-sm">
            <span class="material-symbols-outlined text-[#1f1b11]">person</span> </div>
        <h1 class="font-black text-2xl tracking-tighter text-[#1f1b11]">PROFIL</h1> 
    </header>

    <main class="px-5 mt-8 space-y-6">
        <div class="bg-white p-6 rounded-[24px] ambient-shadow border border-[#e5dfd3] flex flex-col items-center text-center">
            
            <input type="file" id="input-foto" accept="image/*" class="hidden" onchange="gantiFoto(event)">
            
            <div onclick="document.getElementById('input-foto').click()" class="relative w-24 h-24 bg-[#ffd700] rounded-full border-4 border-white shadow-md flex items-center justify-center mb-4 cursor-pointer overflow-hidden group">
                <span id="ikon-default" class="material-symbols-outlined text-5xl text-[#1f1b11]">face</span>
                
                <img id="tampilan-foto" src="" class="absolute inset-0 w-full h-full object-cover hidden" alt="Foto Profil">
                
                <div class="absolute bottom-0 right-0 bg-white p-1 rounded-full border border-[#f5eddb] shadow-sm z-10">
                    <span class="material-symbols-outlined text-sm text-[#7e7760]">edit</span>
                </div>
            </div>
            
            <input type="text" id="input-username" placeholder="Contoh: Ayam Jago" class="w-full bg-[#fff9ef] border border-[#e5dfd3] rounded-xl px-4 py-3 text-center font-semibold text-[#1f1b11] outline-none focus:border-[#ffd700] transition-all mb-1">
            
            <p class="text-[11px] text-[#7e7760] mb-3 italic">Username dipakai supaya bisa Check-in meja</p>
            
            <button onclick="simpanProfil()" class="w-full bg-[#1f1b11] text-white py-3 rounded-xl font-bold active:scale-95 transition-all">Simpan Profil</button>            
        </div>

        <button onclick="bukaPortalPenjual()" class="w-full bg-white p-4 rounded-2xl ambient-shadow border border-[#e5dfd3] flex items-center justify-between active:scale-95 transition-all">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-red-50 text-red-600 rounded-xl flex items-center justify-center">
                    <span class="material-symbols-outlined">storefront</span>
                </div>
                <span class="font-bold text-[#1f1b11]">Mode Penjual</span>
            </div>
            <span class="material-symbols-outlined text-[#7e7760]">chevron_right</span>
        </button>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t h-20 flex justify-around items-center z-[100] shadow-lg">
        <a href="index.html" class="text-[#7e7760] flex flex-col items-center active:scale-95 transition-all"><span class="material-symbols-outlined">home</span></a>
        
        <a href="scan.html" class="bg-[#ffd700] text-[#1f1b11] w-14 h-14 rounded-full -mt-10 flex items-center justify-center shadow-lg border-4 border-white cursor-pointer active:scale-95 transition-all">
            <span class="material-symbols-outlined">qr_code_scanner</span>
        </a>
        
        <div class="text-[#705d00] flex flex-col items-center relative">
            <span class="material-symbols-outlined">person</span>
            <div class="w-1 h-1 bg-[#ffd700] rounded-full mt-1 absolute -bottom-2"></div>
        </div>
    </nav>

    <script>
        // Saat halaman dimuat, cek apakah ada data tersimpan
        window.onload = () => {
            const usernameTersimpan = localStorage.getItem('myburjo_username');
            const fotoTersimpan = localStorage.getItem('myburjo_foto');
            
            if(usernameTersimpan) {
                document.getElementById('input-username').value = usernameTersimpan;
            }

            if(fotoTersimpan) {
                tampilkanFoto(fotoTersimpan);
            }
        };

        // Fungsi mengubah file gambar menjadi teks Base64 untuk disimpan
        window.gantiFoto = (event) => {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const hasilBase64 = e.target.result;
                    tampilkanFoto(hasilBase64);
                    // Langsung simpan ke localStorage
                    localStorage.setItem('myburjo_foto', hasilBase64);
                }
                reader.readAsDataURL(file);
            }
        };

        // Fungsi untuk mengatur tampilan UI jika ada foto
        function tampilkanFoto(src) {
            const imgEl = document.getElementById('tampilan-foto');
            const iconEl = document.getElementById('ikon-default');
            
            imgEl.src = src;
            imgEl.classList.remove('hidden');
            iconEl.classList.add('hidden');
        }

        // Fungsi simpan username
        window.simpanProfil = () => {
            const nama = document.getElementById('input-username').value;
            if(nama.trim() === "") {
                alert("Username tidak boleh kosong ya!");
                return;
            }
            localStorage.setItem('myburjo_username', nama);
            alert("Profil berhasil disimpan!");
        };

        window.bukaPortalPenjual = () => {
            window.location.href = "login-penjual.html";
        };
    </script>
</body>
</html>
